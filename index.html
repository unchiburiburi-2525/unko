/* ===== 裏ボス（怨念の大うんこ怪獣）の特別演出：ステージ21 =====
   pre    ：最初はいつも通り、通行人が歩いてくる（普通に投げられる）
   drop   ：数秒後、奥から紫の衝撃波が来て通行人が一斉に倒れ、画面が真っ暗になる
   intro  ：真っ暗な画面。タップするたびにセリフが1つずつ出る（3つ）→ もう一度タップで目が光る → 全体が現れてラウンド制の戦いへ
   fight  ：いつものラウンド制。HP4割で「このまま押し切れ！」。最後の「倒し切れ」でHPを0まで削ると→
   ko     ：撃破…と思いきや、静まり返る
   despair：HPが戻って(文字は出さない)大笑い →「お前は俺だ！」→「ウンコをウンコで倒せるわけないだろう」(1文字ずつ)
            → 今までのボスの能力をいくつも同時に使う姿へ（御加護・両腕のディスク・時計・人魂・窓・排水口・残り香）。
            うんこ弾幕と下痢の豪雨が迫るが、絶望でうんこが出ない。体力が1まで削られる
   room   ：ウンコ・デス・オブリージュに閉じ込められる。ノックの輪はパリィできない（1発目はゆっくり、2発目からは速い）。
            なぜか当たるたびに回復 → 扉の向こうに快便店長。店長は裏ボスの攻撃の身代わりになってやられる
   charge ：「気張れ！ うんちを溜めろ！」うんこ波動砲を溜める（前半＝長押し／中盤＝輪に合わせてタップ／終盤＝連打）。
            窓から歴代ボスが2〜3人ずつ現れ、それぞれの能力で弾を防いでくれるが、1組ずつやられていく。
            クソ弾幕の王も窓という窓から応戦するが力尽き、最後はホットノズルが洗剤ビームで裏ボスのビームと押し合う
   fire   ：「私ごと撃て！」→ うんこ波動砲、発射！
   end    ：真っ白な光 → 晴れたウンコだらけの街 → しばらくしてゆっくり「Thanks for playing!」、後ろがカラフルなうんこで埋まる
            → クリアを記録してホーム画面へ
   ※ 溜めの場面は負けない。溜まるまで仲間が守り続ける */

 if(TOUCH){setOv({t:'',m:'<img class="howimg" alt="あそびかたの図" src="'+HOWIMG+'">',b:[['くわしく',howto2],['もどる',menu,'pri']]});var mg=document.getElementById('msg');if(mg)mg.style.maxWidth='none';return}

function howto2(){
 setOv({t:'あそびかた',m:'<div class="how" style="text-align:left;line-height:1.6">'
  +'<b style="color:var(--yel)">画面をタップ</b>　うんこを投げる（飛んでくる敵のうんこも撃ち落とせる）<br>'
  +'<b style="color:var(--yel)">うんこの欄</b>　タップで切り替え（ステージを進めると増える）<br>'
  +'<b style="color:var(--yel)">おなら</b>　欄で選んで画面をタップ → 近くの敵を一掃<br>'
  +'<b style="color:var(--yel)">便座ガード</b>　タップでガード。当たる直前なら<em>パリィ</em>（反撃＋回復）<br>'
  +'<b style="color:var(--yel)">快便ゲージ</b>　満タンでタップ → <em>快便ゾーン</em>（4秒スロー）<br>'
  +'<b style="color:var(--yel)">右上の Ⅱ</b>　ポーズ<hr>'
  +'ぶつかられるとHPが減る。時間内にスコア目標を達成するとボス出現。<br>'
  +(icoImg('tp',1.1)||'🧻')+' をタップでHP回復。ボスの技の対処は、上の<b>黄色い帯</b>に出る。</div>',
  b:[['図にもどる',howto],['もどる',menu,'pri']]})}
function howtoPC(){
 setOv({t:'あそびかた',m:'<div class="how"><b>マウス</b> 照準 ／ <b>クリック</b> うんこを投げる<br><b>1〜4</b> または <b>← →</b> うんこの切り替え<br><b>↑ / W</b> 便座ガード（当たる直前に押すと<em>パリィ</em>で反撃＆ゲージ＆HP回復）<br><b>F</b> おなら噴射（近くの敵を一掃。クールタイム長め）<br><b>Space</b> 快便ゾーン（ゲージ満タンで4秒スロー）<br><b>Esc / P</b> または右上の<b>Ⅱ</b> でポーズ<hr>通行人にぶつかられるとHPが減る。スコア目標を達成するとボス出現。<br>画面端に出る <b>'+(icoImg('tp',1.2)||'🧻')+'</b> をクリックでHP回復（数秒で消える）。HPが満タンの時は<b>青いシールド</b>（最大+20%）に、それも満タンなら快便ゾーンのチャージになる。<br>ボスの能力は画面上部の<b>黄色いバナー</b>に「いま何をすべきか」が出る。</div>',b:[['もどる',menu,'pri']]})}

 grid.innerHTML='';
 ST.forEach(function(s,i){

  e.onclick=function(){snd0();snd('ui');intro(i)};grid.appendChild(e)})}

 var m='<div class="how"><b>STAGE '+(i+1)+'</b>　'+(S.kind==='school'?icoImg('school',1.3)+' 学校':S.kind==='train'?icoImg('train',1.3)+' 電車':icoImg('city',1.3)+' 街')+'　目標 <b>'+S.goal+'pt</b>　制限 <b>'+S.time+'秒</b><hr>'
  +'<b>BOSS：'+bossNames(S.b)+'</b><br>'+defs.map(function(d){return'「'+d.ln+'」'}).join('<br>')
  +'<br>'+(abs.length?'<span class="abi">'+abs.map(function(a){var nm=(AB[a]&&AB[a].n)||AD[a];return'<span title="'+nm+'">'+(icoImg(a,abs.length>14?2.2:2.7,nm)||'<span style="font-size:'+(abs.length>14?2.2:2.7)+'em">'+((AB[a]&&AB[a].i)||'')+'</span>')+'</span>'}).join('')+'</span>':'<span class="ab">特殊能力なし（まずは練習）</span>') /* v153 ボスの能力はアイコンで、大きめに */
  +'<br><span class="ab">この街の名物：'+icoImg('m_'+UMOB[i],1.3)+' '+MB[UMOB[i]].nm+'（'+MB[UMOB[i]].d+'）</span>'
  +(nw.length?'<hr>'+icoImg('unlock',1.2)+' 新うんこ解放：<b>'+nw.join('、')+'</b>':'')+'</div>';
 setOv({t:S.n,m:m,pv:true,b:[['出撃！',function(){start(i)},'pri'],['ステージ選択',stageSelect]]})}

/* ボスの立ち絵 */
var PVS={kaiju:.78,bike:1.0,sage:1.15,king:1.2,toilet:1.3,cyborg:1.25,wrest:1.3,demo:1.2};
function drawPortrait(){
 var pw=300,ph=280,pc=pvc.getContext('2d');
 if(pvc.width!==pw*DPR){pvc.width=pw*DPR;pvc.height=ph*DPR}
 pc.setTransform(DPR,0,0,DPR,0,0);
 var P=S.p,g=pc.createLinearGradient(0,0,0,ph);g.addColorStop(0,P.sky[0]);g.addColorStop(1,P.sky[1]);pc.fillStyle=g;pc.fillRect(0,0,pw,ph);
 pc.fillStyle='rgba(0,0,0,.22)';for(var i=0;i<12;i++){pc.beginPath();pc.moveTo(pw/2,ph*.6);pc.lineTo(pw/2+Math.cos(i*.52+.1)*400,ph*.6+Math.sin(i*.52+.1)*400);pc.lineTo(pw/2+Math.cos(i*.52+.35)*400,ph*.6+Math.sin(i*.52+.35)*400);pc.fill()}
 var defs=BOSS[S.b];defs=Array.isArray(defs)?defs:[defs];
 var old=ctx;ctx=pc;
 try{defs.forEach(function(d,k){var key=d.k||S.b,L=LOOK[key];if(!L)return;
  var sc=(PVS[key]||1.55)*(defs.length>1?.82:1),x=defs.length>1?pw/2+(k?72:-72):pw/2;
  pc.save();pc.translate(x,ph-16);pc.scale(sc,sc);
  pc.fillStyle='rgba(0,0,0,.3)';pc.beginPath();pc.ellipse(0,0,40,9,0,0,7);pc.fill();
  drawActor(pc,L,{ph:Math.sin(gt*3)*.4,t:gt,hurt:false,atk:0,rim:'#fff'});pc.restore()})}catch(e){}
 ctx=old;
 var gv=pc.createRadialGradient(pw/2,ph/2,ph*.4,pw/2,ph/2,ph*.85);gv.addColorStop(0,'rgba(0,0,0,0)');gv.addColorStop(1,'rgba(0,0,0,.5)');pc.fillStyle=gv;pc.fillRect(0,0,pw,ph);
 pc.strokeStyle='#ffe23a';pc.lineWidth=3;pc.strokeRect(1.5,1.5,pw-3,ph-3)}

/* ===== 開始・終了 ===== */
function start(i){
 snd0();LOG.abort();si=i;S=STG[i];runReset();LOG.begin();
 WP.forEach(function(w){if(w.un<=i+1)mark('w',w.id)});
 score=0;time=S.time;hp=100;hpg=100;combo=0;sel=0;
 peds=[];shots=[];splats=[];pops=[];ptc=[];fx=[];items=[];mud=[];wins=[];bl=[];rn=[];sm=[];pl=[];
 sp=1;dist=0;gt=0;shake=0;flash=0;hs=0;TS=1;sw=0;gl=0;
 gd=0;gcd=0;gas=0;gasCd=0;gst=0;gk=0;gauge=0;sand=0;fin=0;cons=0;
 tskFx=0;bko=0;bkw=0;kcnt=0;kvT=0;kvS=0;krT=0;krS=0;inv=0;invMode=0;dark=0;plGood=false;plT=0;bar=0;typed=0;barT=0;
 tstop=0;tsOn=0;tsB=null;dbf=0;stink=0;stinkT=0;rm=null;nocross=0;
 seen={};tb=null;wv=[0,0,0];bwait=0;inBlast=false;bphase=0;bossDown=0;bline='';blt=0;cut=null;blind=false;curDefs=[];HY=HY0;
 newStock();
 for(var k=0;k<3;k++)spawn(14+k*5);
 state='play';ov.classList.add('hide');
 cut={i:'🚽',n:'STAGE '+(i+1),c:'#ffe23a',d:S.n+'　— 目標 '+S.goal+'pt でボス出現',t:0,dur:1.3};
 uraBegin(); /* 裏ボス：数秒後に通行人が一斉に倒されて暗転する特別演出 */
 bgm(0)}

/* v161 裏ボスのクリアを先に保存(Thanks for playing! の画面で閉じても、クリアが残るように)。finish でももう一度保存するが、内容は同じ */
function uraSaveClear(){try{var o=rankOf(),rk=o.r;if(!save.r[si]||rankIdx(rk)>rankIdx(save.r[si]))save.r[si]=rk;save.u=Math.max(save.u,Math.min(21,si+2));save.b[si]=Math.max(save.b[si]||0,score);sv()}catch(e){}}
function finish(ok,why){
 if(state!=='play')return;
 var uraEnd=!!(ura&&ura.ph==='end');ura=null;
 state='over';bgm(-1);TS=1;fin=0;LOG.rec(ok,why||(ok?'クリア':''));
 if(!uraEnd)jingle(ok);
 var nextOk=ok&&si<20,rk=null,newR=false,newB=false,left=[];
 if(ok){
  var was=allCleared(),o=rankOf();rk=o.r;if(!save.r[si]||rankIdx(rk)>rankIdx(save.r[si])){save.r[si]=rk;newR=true}
  save.u=Math.max(save.u,Math.min(21,si+2));var pb=save.b[si]||0;newB=score>pb;save.b[si]=Math.max(pb,score);sv();
  var nx=si+1,nw=WP.filter(function(w){return w.un===nx+1}).map(function(w){return w.n});
  if(nw.length&&nx<21)left.push(icoImg('unlock',1.2)+' '+nw.join('、'));
  if(!was&&allCleared())left.push(icoImg('unlock',1.2)+' 新しい遊びが解放された')}
 var ac=checkAch({ok:ok,rk:rk});
 if(uraEnd){menu(1);return} /* 裏ボスのエンディング：Thanks for playing! のあとはホーム画面へ */
 var body;
 if(ok)body='<div class="how"><span class="rk" style="color:'+RCOL[rk]+'">'+rk+'</span>'+(newR?' <b>NEW</b>':'')+'<br>'+icoImg('hp',1.2)+' '+Math.max(0,Math.round(hp))+'　'+icoImg('a_parry',1.2)+' '+run.parry+'　'+icoImg('timer',1.2)+' '+Math.round(run.bT)+'s<br>'+score+'pt'+(newB?' <b>NEW</b>':'')+(left.length?'<br><span class="ab">'+left.join('<br>')+'</span>':'')+achHtml(ac)+'</div>';
 else body=(why||'やられた…')+'<br>スコア <b>'+score+'</b>';
 setOv({t:ok?'<span class="win">STAGE CLEAR！</span>':'<span class="lose">GAME OVER</span>',m:body,
  b:(nextOk?[['次のステージへ',function(){intro(si+1)},'pri']]:[]).concat([['もう一度',function(){start(si)},nextOk?'':'pri'],['ステージ選択',stageSelect]])})}

function pauseGame2(){setOv({t:'ポーズ',b:[['再開',function(){ov.classList.add('hide');state='play'},'pri'],['せってい',function(){settings(pauseGame2)}],['やめる',menu]]})}
function pauseGame(){if(state!=='play')return;state='pause';setOv({t:'ポーズ',b:[['再開',function(){ov.classList.add('hide');state='play'},'pri'],['せってい',function(){settings(pauseGame2)}],['やめる',menu]]})}
document.addEventListener('keydown',function(e){if(e.key==='Escape'){if(state==='play')pauseGame();else if(state==='pause'){ov.classList.add('hide');state='play'}}});
document.addEventListener('visibilitychange',function(){if(document.hidden)pauseGame()});

/* ===== ループ ===== */
var lastDraw=0;
function loop(ts){
 /* 省電力：30fps（スマホ）。タイトル等の操作が少ない画面はPCでも30fps */
 if((LOW||state!=='play')&&ts-lastDraw<29){requestAnimationFrame(loop);return}
 lastDraw=ts;
 var dt=Math.min(.05,(ts-last)/1000||0);last=ts;
 try{
  var cur=state==='play'?'none':'default';if(cv.style.cursor!==cur)cv.style.cursor=cur;
  if(state==='play')step(dt);
  else{gt+=dt;if(state==='title'||state==='intro')dist+=WALK*dt*.6}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
  draw();
  if(state==='intro')drawPortrait();
 }catch(err){if(!window.__err){window.__err=err;console.error(err)}}
 requestAnimationFrame(loop)}


/* v170 今はスマホ版だけ公開。PCで開いたら案内だけ出す(PC版は後のアップデートで開放)。#pc で開けばPCでも遊べる(持ち主のテスト用) */
function pcOnly(){state='pc';S=STG[0];peds=[];setOv({t:'<span class="lg">うんこ投げ通り</span><span class="sm">FPS</span>',m:'今はスマホ版だけ公開しています。<br><b>スマホで開いて遊んでね。</b><br><span class="dim">PC版は、今後のアップデートで遊べるようになります。</span>',b:[]});var o=document.getElementById('ov');if(o)o.classList.add('home')}
if(!TOUCH&&!/pc/.test(location.hash)&&!window.__ev)pcOnly();else menu();
requestAnimationFrame(loop);

})();
