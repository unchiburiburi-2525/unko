<style>

*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Hiragino Sans","Noto Sans JP",system-ui,sans-serif;display:flex;align-items:center;justify-content:center}
#wrap{position:relative;width:min(100vw,calc((100vh - 24px)*16/9));aspect-ratio:16/9;touch-action:none;user-select:none;-webkit-user-select:none;container-type:inline-size}

#ov.home{background:linear-gradient(180deg,rgba(10,4,22,.5),rgba(10,4,22,.78))}

button:hover:not(:disabled){filter:brightness(1.2)}

button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:3px}

button.st small{font-size:.7em;opacity:.75;font-weight:600}
button.st u{position:absolute;right:5px;top:2px;color:var(--yel);text-decoration:none;font-size:.9em}
button.st.ura{box-shadow:inset 0 0 0 2px #ff2a8a;background:#2a0a22}
button.st.lock{opacity:.3}
button.st.zk.wpn{box-shadow:inset 0 0 0 2px #ffd23a;background:#2a2008} 
.rk{font-size:clamp(46px,9cqw,92px);font-weight:900;line-height:1;text-shadow:0 0 18px currentColor}
button.st.unk{opacity:.55}button.st.ach{box-shadow:inset 0 0 0 2px #ffd23a}
.zc{display:flex;flex-direction:column;align-items:center;gap:2px;width:100%}.zc canvas{border-radius:6px;max-width:100%}.zc span{font-size:.82em;line-height:1.15}.zc small{font-size:.66em;opacity:.8}.zi{font-size:2.1em;line-height:1.2;height:1.4em}
button.zk{padding:.35em .2em}
.set{display:grid;gap:16px;width:min(520px,80cqw)}.set label{display:flex;align-items:center;gap:14px;font-weight:800;font-size:clamp(14px,2cqw,20px)}.set label b{min-width:4.5em;text-align:left}.set input[type=range]{flex:1;accent-color:var(--yel)}.set label i{font-style:normal;min-width:2.4em;text-align:right;color:var(--yel)}
.hide{display:none!important}

}

覚",discb:"ディスクβ（ウンコ屈折ディスク）",tskip:"より一歩先へ！",thrower:"ウンコ合戦",drain:"ブリブリ吸引",ult:"本気の気張り（マックス・プレッシャー）",tstop:"漏らすわけには！",stink:"残り香",nocross:"ウェアー・イズ・トイレ",room:"ウンコ・デス・オブリージュ",shield:"便蓋シールド"};var AX={blk:"技の合間に、画面が真っ暗になる。明けると王は別の窓へ移り、飛んでいた弾の位置も入れ替わる。弾幕や豪雨の途中でも起こる。<br><b>対処：</b>暗くなる前に弾を減らす。",dash:"ボスが気張ってから、一気に目の前まで突っ込んでくる。<br><b>対処：</b>ぶつかる直前にガード。ギリギリで押せばパリィになり、ボスにダメージ。構えないと大ダメージ。",stand:"ボスが便座の加護で守りを固める。守りが固い間に当てると、ボスが回復してしまう。<br><b>対処：</b>守りが緩むまで待ち、緩んだ瞬間に当てる。その間は通行人を倒してポイントを稼ごう。",wins:"画面に警告ウィンドウが何枚も出る。全部閉じるまで、ボスにダメージが入らない。<br><b>対処：</b>ウィンドウの右上の×を押して、全部閉じる。",inv:"便意に振り回されて、照準の動きが逆になる。左右・上下・その両方のどれかが反転する。<br><b>対処：</b>落ち着いて、反対に動かす。",dark:"しばらくの間、視界が暗く狭くなる。<br><b>対処：</b>落ち着いて狙う。",bullets:"怒ったうんこの弾が次々に迫ってくる。当たるとダメージ。<br><b>対処：</b>クリックで撃ち落とす。",clones:"ボスが何人にも分かれて、本物が分からなくなる。偽物は当てれば消える。<br><b>対処：</b>動きや、当てた時の反応から本物を見分ける。",portal:"赤と青のゲートが現れる。放っておくとワープ攻撃を受ける。<br><b>対処：</b>手前の色が違う時は反撃のチャンス（ボスにダメージ）。同じ色の時は撃ってはいけない。",possess:"ボスが通行人に憑依して突っ込んでくる。憑依された通行人は、ふつうより少し速い。ぶつかられると大ダメージ。通り過ぎられると、うんこを投げるのを阻害される。<br><b>対処：</b>憑依された通行人を先に倒す。倒すとボスにダメージ。",disc:"ボスがディスクαを回して、投げたうんこを跳ね返す。<br><b>対処：</b>回転が止まる一瞬を狙って当てる。",discb:"ディスクβが回っている間、投げたうんこがカーブして、狙った場所からずれて飛ぶ。曲がる向きは、ディスクの回転の向きと同じ。<br><b>対処：</b>回転の向きを見て、曲がる分を予測して狙う。",tskip:"時計の音が鳴ったあと、約1.2秒分の時間が一瞬で消える。飛んでいた弾幕や下痢は1.2秒分近づき、ボスは別の場所へ移り、こちらが投げていたうんこは消える。<br><b>対処：</b>予告の間に弾を撃ち落としておく。投げるのは時が飛んでからにする。",mirage:"臭いで目がくらんで、ボスが本物の位置から左右反転して見える。<br><b>対処：</b>見えている位置の反対側を狙う。",sweep:"ボスが洗剤ビームを撃ってくる。当たると大ダメージ。<br><b>対処：</b>タイミングを合わせてガードすると、ボスに跳ね返せる。",slime:"ヒーローがスライムペタルを飛ばしてくる。撃つと小さく分かれる。<br><b>対処：</b>分かれたものも全部撃つ。",gift:"ボットンボックスが降ってくる。放っておくと、中身のうんこが飛び散る。<br><b>対処：</b>早めに撃てば何も起きない。",rain:"ボスが下痢を噴射して、上から降り注ぐ。着弾点には輪が出て、だんだん縮んでいく。落ちると画面にこびりついて、しばらくそこが見えなくなる。<br><b>対処：</b>着弾の直前に、落ちてくる下痢か着弾点を撃つ。早すぎると消えない。",mud:"粘り気のあるウンコだまりができる。ウンコだまりを狙うと、うんこが遅くなって当てにくい。<br><b>対処：</b>ウンコだまりを避けて狙う。",type:"UNKOバリアが張られる。解除するまで、ボスにダメージが入らない。時間切れで爆発する。<br><b>対処：</b>「U→N→K→O」の順に入力して解除する。PCはキーボードで入力。スマホはパネルの並びがバラバラなので、U→N→K→Oの順に探してタップする。",rewind:"ボスが時間を記録して、しばらくすると、その時点のHPまで巻き戻す。<br><b>対処：</b>巻き戻りの直後に、一気に畳みかける。",weak:"ボスが巨大化して、体に弱点（緑）とワナ（赤）が現れる。赤を撃つと反撃を受けて、それまでに壊した緑が全部復活する。<br><b>対処：</b>赤を避けて、緑だけを全部壊すと大ダメージ。",scare:"ウン神様が、突然画面に飛び出す。ガードしないと腰を抜かして、しばらく便秘になる。<br><b>対処：</b>「何か来る！」の表示が出たら、ガードを構える。",thrower:"ボスが、こちらのうんこを投げ返してくる。受け止められないとダメージ。<br><b>対処：</b>クリックで撃ち落とす。<br>ガードで受け止めると、うんこを奪える。",drain:"ボスが、近くの通行人からHPを吸い取って回復する。<br><b>対処：</b>吸われている通行人を先に倒して、止める。",ult:"ボスが技名を叫びながら気張って、大技を繰り出す。止められないと大ダメージ。<br><b>対処：</b>気張っている間に、連続で当てて止める。覆面ブリ男は3回当てれば止まる。",tstop:"時が止まって、こちらは動けない。ボスだけは止まった世界でウンコを仕込み、そのウンコが迫ってくる。<br><b>対処：</b>快便ゲージが満タンなら、快便ゾーンで動いて撃ち落とせる。",stink:"残り香が漂い、ゲージが溜まっていく。満タンになるとダウン寸前になる。<br><b>対処：</b>おならで吹き飛ばす。",nocross:"しばらくの間、照準が消える。<br><b>対処：</b>投げる方向の感覚を頼りに狙う。",room:"個室に閉じ込められて、壁が迫ってくる。壁が詰まるリズムに合わせてガードする。<br><b>対処：</b>全部成功すると脱出して、ボスにダメージ。失敗するとダメージを受ける。",revive:"二人はつながっている。片方を倒しても、もう片方が生きていると、しばらくして復活する。<br><b>対処：</b>時間内に、両方を倒す。",warp:"攻撃を受けると、ちびって別の場所へ逃げることがある。<br><b>対処：</b>逃げた先を見失わないようにする。",ghost:"周期的に体が透けて、攻撃がすり抜ける。<br><b>対処：</b>透けている間は投げても無駄。戻ってくるのを待つ。",invis:"姿がほとんど見えない。当てると、少しの間だけ姿を現す。<br><b>対処：</b>姿が見えた瞬間を逃さず、続けて当てる。",counter:"攻撃を受けると、30%ほどの確率でカウンターの構えを取る。「カウンターが来る！」と表示されると、反撃が来る。<br><b>対処：</b>表示が出たらガード。ギリギリで押せばパリィになる。",mad:"攻撃を受けるほど怒りが溜まって、動きが速くなる。<br><b>対処：</b>短時間で、一気に倒す。",rage:"HPが半分を切ると激昂して、動きがどんどん速くなり、技も立て続けに来る。<br><b>対処：</b>ガードをいつでも使えるようにしておく。",blind:"HPが半分を切ると、辺りが臭いで霞んで、通行人が薄くしか見えなくなる。<br><b>対処：</b>薄く見える通行人にも気をつけて、ぶつかられる前に撃つ。",window:"窓から顔を出して、すぐに引っ込む。毎回どれが本物かは分からない。冠をかぶっていない偽物の顔が出ることもあり、偽物を撃つとうんこが返ってくる。<br><b>対処：</b>冠をかぶった本物だけを狙う。",dig:"地中に潜って移動する。放っておくと、足元から飛び出してくる。<br><b>対処：</b>潜っている間は、盛り上がった土を狙う。",shield:"便蓋のシールドで守りを固める。途中で外すと元に戻る。<br><b>対処：</b>続けて当てるか、洗剤ビームをパリィで跳ね返すと壊せる。",wall:"裏ボスの体を包む怨念の壁。張られている間は、どんなうんこを投げても弾かれてしまう。<br><b>対処：</b>ラウンドごとの連携技を全部さばき切ると「お前の番」になり、そのあいだだけ壁が消えて攻撃が通る。",rush:"うんこを当てる・敵を倒す・パリィを決めると、ゲージが溜まる。満タンでSpace(スマホは左下のボタン)を押すと、4秒間まわりがスローになる。<br>時が止まった世界でも、これを使えば動いて投げられる。",guard:"↑キー(スマホは右下のボタン)で便座を構えて、攻撃を防ぐ。当たる直前に構えると「パリィ」になり、ゲージが大きく溜まって体力も少し戻る。<br>一度構えると、少しのあいだ使えない。",bhole:"最後の最後に、みんなが時間を稼いでくれて撃てた一撃。気張って溜めたうんこを
